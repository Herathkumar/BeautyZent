      <stop offset="0%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <linearGradient id="clientGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d7b0"/>
