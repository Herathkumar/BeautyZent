      <stop offset="0%" stop-color="#3a2c33"/>
      <stop offset="100%" stop-color="#221a1f"/>
    </linearGradient>
    <linearGradient id="clientRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2c4b0"/>
      <stop offset="100%" stop-color="#c9a87c"/>
    </linearGradient>
    <clipPath id="clientDisc">
