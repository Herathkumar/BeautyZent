  <g clip-path="url(#clientDisc)">
    <rect width="160" height="160" fill="url(#clientBg)"/>
    <circle cx="80" cy="66" r="26" fill="url(#clientRose)"/>
    <circle cx="80" cy="158" r="52" fill="url(#clientRose)"/>
