<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FHS Client">
  <defs>
    <linearGradient id="fhsClientBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2038"/>
      <stop offset="100%" stop-color="#14101c"/>
    </linearGradient>
    <linearGradient id="fhsClientLilac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0d0f5"/>
      <stop offset="100%" stop-color="#9b7ec4"/>
    </linearGradient>
    <clipPath id="fhsClientDisc">
      <circle cx="256" cy="256" r="132"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#fhsClientBg)"/>

  <!-- Member ring -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#fhsClientLilac)" stroke-width="18" opacity="0.55"/>

  <!-- Client portrait, clipped to the avatar disc -->
  <g clip-path="url(#fhsClientDisc)">
    <circle cx="256" cy="256" r="132" fill="#35264a"/>
    <circle cx="256" cy="216" r="58" fill="url(#fhsClientLilac)"/>
    <circle cx="256" cy="412" r="112" fill="url(#fhsClientLilac)"/>
  </g>

  <!-- Salon sparkle -->
  <path d="M386 108l14 38 38 14-38 14-14 38-14-38-38-14 38-14z" fill="#e0d0f5"/>
</svg>
