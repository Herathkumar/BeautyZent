<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FHS Client">
  <defs>
    <linearGradient id="fhsClientBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2126"/>
      <stop offset="100%" stop-color="#161114"/>
    </linearGradient>
    <linearGradient id="fhsClientRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2c4b0"/>
      <stop offset="100%" stop-color="#c9a87c"/>
    </linearGradient>
    <clipPath id="fhsClientDisc">
      <circle cx="256" cy="256" r="132"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#fhsClientBg)"/>

  <!-- Member ring -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#fhsClientRose)" stroke-width="18" opacity="0.45"/>

  <!-- Client portrait, clipped to the avatar disc -->
  <g clip-path="url(#fhsClientDisc)">
    <circle cx="256" cy="256" r="132" fill="#3a2c33"/>
    <circle cx="256" cy="216" r="58" fill="url(#fhsClientRose)"/>
    <circle cx="256" cy="412" r="112" fill="url(#fhsClientRose)"/>
  </g>

  <!-- Salon sparkle -->
  <path d="M386 108l14 38 38 14-38 14-14 38-14-38-38-14 38-14z" fill="#f2c4b0"/>
</svg>
