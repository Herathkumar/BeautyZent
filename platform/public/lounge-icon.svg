<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BeautyZent Lounge">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a221c"/>
      <stop offset="100%" stop-color="#15110e"/>
    </linearGradient>
    <linearGradient id="lgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c987"/>
      <stop offset="100%" stop-color="#c9a87c"/>
    </linearGradient>
    <linearGradient id="lgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c9a0"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#lgBg)"/>
  <circle cx="256" cy="220" r="160" fill="#c9a87c" opacity="0.12"/>

  <!-- Sofa back -->
  <rect x="96" y="168" width="320" height="88" rx="36" fill="url(#lgWarm)" opacity="0.95"/>
  <!-- Sofa seat -->
  <rect x="80" y="248" width="352" height="72" rx="28" fill="url(#lgGold)"/>
  <!-- Cushion divide -->
  <rect x="248" y="258" width="16" height="52" rx="6" fill="#1c1714" opacity="0.28"/>
  <!-- Legs -->
  <rect x="112" y="320" width="28" height="48" rx="8" fill="#c9a87c" opacity="0.7"/>
  <rect x="372" y="320" width="28" height="48" rx="8" fill="#c9a87c" opacity="0.7"/>
  <!-- Floor shadow -->
  <ellipse cx="256" cy="378" rx="150" ry="14" fill="#c9a87c" opacity="0.18"/>
  <!-- Soft lamp glow -->
  <circle cx="380" cy="140" r="36" fill="#f0c987" opacity="0.35"/>
  <circle cx="380" cy="140" r="16" fill="#f0c987"/>
</svg>
