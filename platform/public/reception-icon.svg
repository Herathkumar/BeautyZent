  <rect x="72" y="318" width="368" height="28" rx="10" fill="url(#rxLilac)"/>

  <!-- Schedule card standing on desk -->
  <rect x="156" y="118" width="200" height="210" rx="28" fill="none" stroke="url(#rxLilac)" stroke-width="18"/>
  <rect x="188" y="156" width="96" height="22" rx="10" fill="#e9d5ff"/>
  <rect x="188" y="202" width="136" height="16" rx="8" fill="#c4b5fd" opacity="0.9"/>
  <rect x="188" y="236" width="118" height="16" rx="8" fill="#a78bfa" opacity="0.75"/>
  <rect x="188" y="270" width="128" height="16" rx="8" fill="#8b5cf6" opacity="0.55"/>

  <!-- Live / open status pip -->
  <circle cx="348" cy="168" r="18" fill="#4ade80"/>
  <circle cx="348" cy="168" r="10" fill="#bbf7d0"/>
