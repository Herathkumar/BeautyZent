<!DOCTYPE html>
<html lang="en" class="display-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>FHSalon Salon Display</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: linear-gradient(180deg, #241c18 0%, #1c1714 50%, #15110f 100%);
        color: #fffaf6;
        font-family: Georgia, "Times New Roman", serif;
      }
      .wrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .brand {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
        color: #f0c987;
      }
      .label {
        margin: 0.5rem 0 1rem;
        font: 600 0.75rem system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .spin {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 2px solid rgba(240, 201, 135, 0.25);
        border-top-color: #f0c987;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" role="status" aria-live="polite">
      <div>
        <p class="brand">FHSalon</p>
        <p class="label">Salon Display</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        document.cookie = "fhsalon_boot=1; Path=/; Max-Age=45; SameSite=Lax";
        var next = "/display/fhsalon";
        try {
          var m = document.cookie.match(/(?:^|; )fhsalon_boot_next=([^;]*)/);
          if (m) next = decodeURIComponent(m[1]);
          document.cookie = "fhsalon_boot_next=; Path=/; Max-Age=0; SameSite=Lax";
        } catch (e) {}
        if (location.pathname.indexOf("/shells/") === 0) {
          var q = new URLSearchParams(location.search).get("next");
          if (q) next = q;
        }
        location.replace(next);
      })();
    </script>
  </body>
</html>
