<!DOCTYPE html>
<html lang="en" class="display-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Salon Display</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #1c1714;
        color: #fffaf6;
        font-family: Georgia, "Times New Roman", serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(180deg, #241c18 0%, #1c1714 50%, #15110f 100%);
      }
      .brand {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
        color: #f0c987;
      }
      .label {
        margin: 0.5rem 0 1rem;
        font: 600 0.75rem system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .spin {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 2px solid rgba(240, 201, 135, 0.25);
        border-top-color: #f0c987;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div>
        <p class="brand" id="splash-brand">Salon</p>
        <p class="label">Salon Display</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        document.cookie = "fhsalon_boot=1; Path=/; Max-Age=120; SameSite=Lax";

        var next = "/display/fhsalon";
        try {
          var m = document.cookie.match(/(?:^|; )fhsalon_boot_next=([^;]*)/);
          if (m) next = decodeURIComponent(m[1]);
          document.cookie = "fhsalon_boot_next=; Path=/; Max-Age=0; SameSite=Lax";
        } catch (e) {}
        var q = new URLSearchParams(location.search).get("next");
        if (q) next = q;

        function slugFromPath(path) {
          var sm = String(path || "").match(/^\/display\/([^/?#]+)/i);
          if (!sm || !sm[1]) return null;
          try {
            return decodeURIComponent(sm[1]);
          } catch (e) {
            return sm[1];
          }
        }

        function setBrand(name) {
          var el = document.getElementById("splash-brand");
          if (el && name) el.textContent = name;
          if (name) document.title = name + " — Salon Display";
        }

        function cacheBrand(salon) {
          if (!salon || !salon.slug || !salon.name) return;
          try {
            var payload = JSON.stringify({
              slug: salon.slug,
              name: salon.name,
              brandColor: salon.brandColor || null,
              accentColor: salon.accentColor || null,
            });
            localStorage.setItem("salon-brand:" + salon.slug, payload);
            localStorage.setItem("salon-brand:last", payload);
          } catch (e) {}
        }

        var slug = slugFromPath(next);
        try {
          var raw = slug ? localStorage.getItem("salon-brand:" + slug) : null;
          if (!raw) raw = localStorage.getItem("salon-brand:last");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.name) setBrand(parsed.name);
          } else if (slug) {
            setBrand(slug.charAt(0).toUpperCase() + slug.slice(1));
          }
        } catch (e) {}

        if (slug) {
          fetch("/api/public/" + encodeURIComponent(slug) + "/brand", {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
            cache: "no-store",
          })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (data) {
              if (data && data.salon && data.salon.name) {
                cacheBrand(data.salon);
                setBrand(data.salon.name);
              }
            })
            .catch(function () {});
        }

        var going = false;
        function go() {
          if (going) return;
          going = true;
          location.replace(next);
        }

        fetch(next, {
          credentials: "same-origin",
          headers: { Accept: "text/html" },
          cache: "no-store",
        })
          .catch(function () {})
          .then(go);

        setTimeout(go, 10000);
      })();
    </script>
  </body>
</html>
