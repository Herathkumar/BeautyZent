<!DOCTYPE html>
<html lang="en" class="manager-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ebe3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FHSalon Manager</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f3ebe3;
        color: #2b2521;
        font-family: Georgia, "Times New Roman", serif;
        overflow: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(180deg, #fdf8f3 0%, #f7f1ea 50%, #f3ebe3 100%);
        transition: opacity 0.35s ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .brand {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
      }
      .label {
        margin: 0.5rem 0 1rem;
        font: 600 0.75rem system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .spin {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 2px solid rgba(125, 97, 84, 0.25);
        border-top-color: #7d6154;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f3ebe3;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div>
        <p class="brand">FHSalon</p>
        <p class="label">Manager</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        /* Set before iframe loads so middleware serves the real app, not this shell again. */
        document.cookie = "fhsalon_boot=1; Path=/; Max-Age=120; SameSite=Lax";

        var next = "/manager";
        try {
          var m = document.cookie.match(/(?:^|; )fhsalon_boot_next=([^;]*)/);
          if (m) next = decodeURIComponent(m[1]);
          document.cookie = "fhsalon_boot_next=; Path=/; Max-Age=0; SameSite=Lax";
        } catch (e) {}
        var q = new URLSearchParams(location.search).get("next");
        if (q) next = q;

        var frame = document.createElement("iframe");
        frame.id = "app";
        frame.title = "FHSalon Manager";
        frame.setAttribute("allow", "clipboard-read; clipboard-write");
        frame.src = next;
        document.body.appendChild(frame);

        var splash = document.getElementById("splash");
        var hidden = false;
        function hideSplash() {
          if (hidden) return;
          hidden = true;
          splash.classList.add("is-done");
          setTimeout(function () {
            splash.remove();
          }, 400);
        }

        frame.addEventListener("load", function () {
          /* Give Next a moment to paint inside the iframe before removing splash. */
          setTimeout(hideSplash, 400);
        });
        /* Safety: never leave splash forever if load is weird. */
        setTimeout(hideSplash, 20000);
      })();
    </script>
  </body>
</html>
