<!DOCTYPE html>
<html lang="en" class="manager-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ebe3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Salon Manager</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #f3ebe3;
        color: #2b2521;
        font-family: Georgia, "Times New Roman", serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(180deg, #fdf8f3 0%, #f7f1ea 50%, #f3ebe3 100%);
      }
      .brand {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
      }
      .label {
        margin: 0.5rem 0 1rem;
        font: 600 0.75rem system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .spin {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 2px solid rgba(125, 97, 84, 0.25);
        border-top-color: #7d6154;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div>
        <p class="brand" id="splash-brand">Salon</p>
        <p class="label">Manager</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        /* Warm the Node app while THIS page stays painted (no iframe — iOS taps break in iframes). */
        document.cookie = "fhsalon_boot=1; Path=/; Max-Age=120; SameSite=Lax";

        var next = "/manager";
        try {
          var m = document.cookie.match(/(?:^|; )fhsalon_boot_next=([^;]*)/);
          if (m) next = decodeURIComponent(m[1]);
          document.cookie = "fhsalon_boot_next=; Path=/; Max-Age=0; SameSite=Lax";
        } catch (e) {}
        var q = new URLSearchParams(location.search).get("next");
        if (q) next = q;

        /* No slug on /manager bookmarks — use last salon cached from book/display/login. */
        try {
          var raw = localStorage.getItem("salon-brand:last");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.name) {
              var el = document.getElementById("splash-brand");
              if (el) el.textContent = parsed.name;
              document.title = parsed.name + " — Manager";
            }
            if (parsed && parsed.managerThemeId) {
              document.documentElement.setAttribute("data-salon-theme", parsed.managerThemeId);
            }
          }
        } catch (e) {}

        var going = false;
        function go() {
          if (going) return;
          going = true;
          location.replace(next);
        }

        fetch(next, {
          credentials: "same-origin",
          headers: { Accept: "text/html" },
          cache: "no-store",
        })
          .catch(function () {})
          .then(go);

        setTimeout(go, 10000);
      })();
    </script>
  </body>
</html>
