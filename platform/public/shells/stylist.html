<!DOCTYPE html>
<html lang="en" class="stylist-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1618" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FHSalon Stylist</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0e1618;
        color: #f4fbfa;
        font-family: Georgia, "Times New Roman", serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(180deg, #152226 0%, #0e1618 48%, #0a1114 100%);
      }
      .brand {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
        color: #b5ebe0;
      }
      .label {
        margin: 0.5rem 0 1rem;
        font: 600 0.75rem system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .spin {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 2px solid rgba(126, 196, 184, 0.25);
        border-top-color: #b5ebe0;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div>
        <p class="brand">FHSalon</p>
        <p class="label">Stylist App</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        document.cookie = "fhsalon_boot=1; Path=/; Max-Age=120; SameSite=Lax";

        var next = "/stylist";
        try {
          var m = document.cookie.match(/(?:^|; )fhsalon_boot_next=([^;]*)/);
          if (m) next = decodeURIComponent(m[1]);
          document.cookie = "fhsalon_boot_next=; Path=/; Max-Age=0; SameSite=Lax";
        } catch (e) {}
        var q = new URLSearchParams(location.search).get("next");
        if (q) next = q;

        var going = false;
        function go() {
          if (going) return;
          going = true;
          location.replace(next);
        }

        fetch(next, {
          credentials: "same-origin",
          headers: { Accept: "text/html" },
          cache: "no-store",
        })
          .catch(function () {})
          .then(go);

        setTimeout(go, 10000);
      })();
    </script>
  </body>
</html>
