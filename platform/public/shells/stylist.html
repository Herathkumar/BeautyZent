<!DOCTYPE html>
<html lang="en" class="stylist-shell stylist-shell--light theme-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Salon Stylist</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #f6f2eb;
        color: #2c2420;
        font-family: Georgia, "Times New Roman", serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background:
          radial-gradient(900px 460px at 85% -8%, rgba(196, 165, 116, 0.14), transparent 55%),
          linear-gradient(180deg, #f6f2eb 0%, #f6f2eb 50%, #efe8dd 100%);
      }
      .brand {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.02em;
        color: #a67f4e;
      }
      .label {
        margin: 0.5rem 0 1rem;
        font: 600 0.75rem system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(166, 127, 78, 0.72);
      }
      .spin {
        width: 1.5rem;
        height: 1.5rem;
        margin: 0 auto;
        border: 2px solid rgba(196, 165, 116, 0.22);
        border-top-color: #c4a574;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div>
        <p class="brand" id="splash-brand">Salon</p>
        <p class="label">Stylist App</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        document.cookie = "fhsalon_boot=1; Path=/; Max-Age=120; SameSite=Lax";

        var next = "/stylist";
        try {
          var m = document.cookie.match(/(?:^|; )fhsalon_boot_next=([^;]*)/);
          if (m) next = decodeURIComponent(m[1]);
          document.cookie = "fhsalon_boot_next=; Path=/; Max-Age=0; SameSite=Lax";
        } catch (e) {}
        var q = new URLSearchParams(location.search).get("next");
        if (q) next = q;

        /* No slug on /stylist bookmarks — use last salon cached from book/display/login. */
        try {
          var raw = localStorage.getItem("salon-brand:last");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.name) {
              var el = document.getElementById("splash-brand");
              if (el) el.textContent = parsed.name;
              document.title = parsed.name + " — Stylist";
            }
          }
        } catch (e) {}

        var going = false;
        function go() {
          if (going) return;
          going = true;
          location.replace(next);
        }

        fetch(next, {
          credentials: "same-origin",
          headers: { Accept: "text/html" },
          cache: "no-store",
        })
          .catch(function () {})
          .then(go);

        setTimeout(go, 10000);
      })();
    </script>
  </body>
</html>
